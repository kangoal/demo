version: '3.8'

services:
  demo-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  demo-service-dev:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: ["demo-service", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev